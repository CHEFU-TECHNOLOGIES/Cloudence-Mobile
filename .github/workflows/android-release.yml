name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Cloudence Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=3072

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.ref_type == 'branch' && github.ref_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Validate release configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name repository secret before running a signed release."
              exit 1
            fi
          done

          package_id="$(node -p "require('./app.json').expo.android.package")"
          if [[ "$package_id" != "za.co.chefu.cloudence" ]]; then
            echo "::error::Unexpected Android package ID: $package_id"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Read saved Android version code
        id: saved-version
        uses: actions/github-script@v8
        env:
          TARGET_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch }}
        with:
          script: |
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo, path: 'app.json', ref: process.env.TARGET_BRANCH,
            });
            const config = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const code = config.expo.android.versionCode;
            if (!Number.isSafeInteger(code) || code < 1) {
              throw new Error('Saved Android version code is invalid.');
            }
            core.setOutput('version-code', code);

      - name: Set release version and Android version code
        id: release-version
        env:
          SAVED_ANDROID_VERSION_CODE: ${{ steps.saved-version.outputs.version-code }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
          const previousCode = Number(process.env.SAVED_ANDROID_VERSION_CODE);
          const versionCode = previousCode + 1;
          if (!Number.isSafeInteger(previousCode) || previousCode < 1 ||
              !Number.isSafeInteger(versionCode) || versionCode > 2100000000) {
            throw new Error("Android version code must be an integer between 1 and 2100000000.");
          }
          const versionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const baseVersion = config.expo.version;
          if (!versionPattern.test(baseVersion)) {
            throw new Error("app.json version must use major.minor.patch format.");
          }
          if (process.env.GITHUB_REF_TYPE === "tag") {
            const tagVersion = (process.env.GITHUB_REF_NAME ?? "").replace(/^v/, "");
            if (!process.env.GITHUB_REF_NAME?.startsWith("v") || !versionPattern.test(tagVersion)) {
              throw new Error("Release tags must use vMAJOR.MINOR.PATCH format.");
            }
            config.expo.version = tagVersion;
          } else {
            const [major, minor, patch] = baseVersion.split(".");
            const nextPatch = Number(patch) + 1;
            if (!Number.isSafeInteger(nextPatch)) {
              throw new Error("Generated patch version exceeds the safe integer range.");
            }
            config.expo.version = `${major}.${minor}.${nextPatch}`;
          }
          config.expo.android.versionCode = versionCode;
          fs.writeFileSync("app.json", `${JSON.stringify(config, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `version=${config.expo.version}\nversion-code=${versionCode}\n`);
          console.log(`Release version: ${config.expo.version}; Android version code: ${versionCode}`);
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          key_store="$RUNNER_TEMP/cloudence-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          chmod 600 "$key_store"
          keytool -list -keystore "$key_store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_RELEASE_KEYSTORE=$key_store" >> "$GITHUB_ENV"

      - name: Build signed APK and app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        working-directory: android
        run: |
          chmod +x gradlew

          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/gradle-release-$attempt.log"
            gradle_args=(:app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2 --stacktrace)
            if [[ "$attempt" -gt 1 ]]; then
              gradle_args+=(--refresh-dependencies)
            fi

            if ./gradlew "${gradle_args[@]}" \
              -Dorg.gradle.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
              -Pkotlin.compiler.execution.strategy=in-process \
              -PreactNativeArchitectures=arm64-v8a,x86_64 \
              -Pandroid.injected.signing.store.file="$ANDROID_RELEASE_KEYSTORE" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" 2>&1 | tee "$log_file"; then
              break
            fi

            if ! grep -Eq \
              'Could not (find|resolve)|Could not parse POM|Read timed out|Connection reset|HTTP response code: 5[0-9][0-9]' \
              "$log_file"; then
              exit 1
            fi

            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            echo "Dependency resolution failed; retrying Gradle build (attempt $((attempt + 1))/3)."
            sleep $((attempt * 15))
          done

      - name: Verify release signatures
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$apk"
          test -f "$aab"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose "$apk"
          jarsigner -verify "$aab"

      - name: Prepare versioned release files
        id: release-files
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          mkdir -p "$RUNNER_TEMP/cloudence-release"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/cloudence-release/Cloudence-$version.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/cloudence-release/Cloudence-$version.aab"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifacts
        id: release-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cloudence-android-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloudence-release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP"/cloudence-release/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Cloudence $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      - name: Write download instructions
        env:
          ARTIFACT_URL: ${{ steps.release-artifacts.outputs.artifact-url }}
          RELEASE_VERSION: ${{ steps.release-files.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release-version.outputs.version-code }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Cloudence Android release $RELEASE_VERSION

          [Download signed APK and AAB artifacts]($ARTIFACT_URL)

          Install the APK directly on Android or upload the AAB to Google Play.
          Tag builds use the tag version and publish both files to GitHub Releases.
          Manual builds increase the patch version by one.
          Android version code: $RELEASE_VERSION_CODE.
          Version changes are saved by the final step only after all release steps succeed.
          EOF

      - name: Sync released version back to app.json
        if: ${{ success() }}
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release-version.outputs.version-code }}
          TARGET_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch }}
        with:
          script: |
            const branch = process.env.TARGET_BRANCH;
            const version = process.env.RELEASE_VERSION;
            const versionCode = Number(process.env.RELEASE_VERSION_CODE);
            const repo = context.repo;
            const newerVersion = (left, right) => {
              const a = left.split('.').map(Number);
              const b = right.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return a[i] > b[i];
              }
              return false;
            };
            for (let attempt = 0; attempt < 3; attempt++) {
              const { data: file } = await github.rest.repos.getContent({
                ...repo, path: 'app.json', ref: branch,
              });
              const config = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
              const currentCode = config.expo.android.versionCode;
              if (currentCode === versionCode && config.expo.version === version) {
                core.info('app.json already matches this release.');
                return;
              }
              if (currentCode >= versionCode || newerVersion(config.expo.version, version)) {
                core.warning(`Skipped version sync: ${branch} already has a newer version.`);
                return;
              }
              // Merge only version fields into the latest file, preserving other app changes.
              config.expo.version = version;
              config.expo.android.versionCode = versionCode;
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  ...repo, path: 'app.json', branch, sha: file.sha,
                  message: `chore: sync Android release ${version} (${versionCode}) [skip ci]`,
                  content: Buffer.from(`${JSON.stringify(config, null, 2)}\n`).toString('base64'),
                });
                core.info(`Synced ${branch}/app.json to ${version} (${versionCode}).`);
                return;
              } catch (error) {
                if (error.status !== 409 || attempt === 2) throw error;
              }
            }
