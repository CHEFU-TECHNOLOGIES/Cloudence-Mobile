name: Android debug build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build debug development client
    runs-on: ubuntu-latest
    env:
      CI: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Assemble debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail

          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/gradle-assemble-$attempt.log"
            gradle_args=(assembleDebug --no-daemon)
            if [ "$attempt" -gt 1 ]; then
              gradle_args+=(--refresh-dependencies)
            fi

            if ./gradlew "${gradle_args[@]}" 2>&1 | tee "$log_file"; then
              exit 0
            fi

            if ! grep -Eq \
              'Could not (find|resolve)|Could not parse POM|Read timed out|Connection reset|HTTP response code: 5[0-9][0-9]' \
              "$log_file"; then
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Dependency resolution failed; retrying Gradle build (attempt $((attempt + 1))/3)."
              sleep $((attempt * 15))
            fi
          done

          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudence-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
